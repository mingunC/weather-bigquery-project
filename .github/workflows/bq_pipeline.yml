name: Daily ETL & Report

on:
  schedule:
    - cron: '0 6 * * *'   # 매일 06:00 UTC
  workflow_dispatch:

jobs:
  etl_and_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery pandas db-dtypes

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: future-cat-458304-j8
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Load data to BigQuery
        run: python scripts/load_data_to_bigquery.py

      - name: Query last 7 days and save CSV
        run: |
          mkdir -p data/processed
          python scripts/query_last7days.py

      - name: Upload report CSV to GCS
        run: |
          gsutil cp data/processed/last7days_*.csv gs://weather-data-bucket-cmgg919/reports/

      - name: Commit report CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/processed/last7days_*.csv
          git commit -m "chore: update last7days report"
          git push